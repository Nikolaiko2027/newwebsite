<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я буду делать сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        ul {
            list-style: none;
            margin-bottom: 30px;
        }
        ul li {
            font-size: 1.1rem;
            margin: 8px 0;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #fff;
            color: #764ba2;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Я буду делать сайт</h1>
    <p>Это мой первый шаг в веб-разработку! Здесь будет жить мой сайт.</p>
    <ul>
        <li>HTML — структура</li>
        <li>CSS — оформление</li>
        <li>JavaScript — интерактив</li>
    </ul>
    <a href="#" class="btn">Начать сюда</a>
    <footer>Сделано с любовью и HTML</footer>
</body>
</html>
