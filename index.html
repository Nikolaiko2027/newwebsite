<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я буду делать сайт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        form { margin-bottom: 30px; }
        input {
            padding: 12px 16px;
            border: none;
            border-radius: 30px 0 0 30px;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 0 30px 30px 0;
            background: #fff;
            color: #764ba2;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        #hello { font-size: 1.5rem; margin-top: 20px; }
        footer { margin-top: 40px; font-size: 0.9rem; opacity: 0.8; }
    </style>
</head>
<body>
    <h1>Я буду делать сайт</h1>
    <form id="helloForm">
        <input type="text" id="name" placeholder="Как тебя зовут?" required>
        <button type="submit">Привет!</button>
    </form>
    <div id="hello"></div>
    <footer>Сделано на FastAPI</footer>
    <script>
        const form = document.getElementById('helloForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const res = await fetch('/hello', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            document.getElementById('hello').textContent = data.message;
        });
    </script>
</body>
</html>
